# What the OpenTelemetry collector in the Lambda layer does with a span.
#
# The ADOT layer ships a default configuration that exports to X-Ray and
# nothing else, so reaching Grafana needs this file and the
# OPENTELEMETRY_COLLECTOR_CONFIG_URI that points at it. It is copied into the
# function bundle at build time — see `bundling.commandHooks` in the stack.
#
# Every credential here comes from the environment, which comes from Secrets
# Manager at deploy time. Nothing secret is in this file, and nothing secret
# should ever be put in it: it is bundled into an artefact and readable by
# anyone who can download the function.

receivers:
  otlp:
    protocols:
      http:
        # The layer's SDK exports here, in-process. Not a network hop.
        endpoint: "localhost:4318"

# No `processors:` block, and not by choice. The ADOT JavaScript Lambda layer
# ships a *reduced* collector: it registers no processor factories at all, so a
# `batch` processor — the obvious thing to want, and what this file had — fails
# the whole config with `unknown type: "batch" ... (valid values: [])`, which
# takes every route down with `Extension.InitError`. Check what a layer actually
# contains before adding one; the upstream OpenTelemetry Lambda layer is the
# alternative if a processor ever becomes necessary.
#
# Losing batching is survivable here: a Lambda handling a few actions a minute
# exports a handful of spans per invocation, and the collector flushes them at
# the end of the invocation either way.

exporters:
  otlphttp/grafana:
    endpoint: "${env:GRAFANA_OTLP_ENDPOINT}"
    headers:
      authorization: "${env:GRAFANA_OTLP_AUTH}"

service:
  # Warnings and worse. The collector's own chatter at `info` costs a line per
  # invocation in CloudWatch, which is a bill for telling us it is working.
  telemetry:
    logs:
      # `debug` is what you want the day this breaks, and it is worth knowing it
      # tells you nothing until the config *parses* — a config the resolver
      # cannot even fetch fails long before this line is read.
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      exporters: [otlphttp/grafana]
