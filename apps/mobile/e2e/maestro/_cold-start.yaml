appId: com.toondeboer.pokerkit
---
# Shared subflow (imported via `runFlow: file: _cold-start.yaml`): force-stop
# the app and cold-start it back into the actual JS app, landing on the timer
# screen (index route).
#
# This is a dev-client build (see apps/mobile/e2e/maestro/README.md) — a plain
# `launchApp` after `stopApp` lands on the Expo dev-launcher's own "Development
# Build" picker screen instead of the app, every time, regardless of
# `clearState`. The dev-launcher only bypasses that picker when launched via
# its own `expo-development-client://` deep link carrying the Metro URL —
# exactly what `npm run android` sends on the very first install. Replaying
# that same link here is what actually gets a *cold* process (not just a
# background→foreground resume) straight to the app.
#
# METRO_URL must match whatever `npm run android -w @poker/mobile` printed
# ("Opening com.toondeboer.pokerkit://expo-development-client/?url=...") for
# the machine currently running Metro — update it if that changes.
- stopApp
- openLink: "com.toondeboer.pokerkit://expo-development-client/?url=http%3A%2F%2F192.168.68.62%3A8081"
# Not "Level 1": the current level persists in storage across relaunches, so
# a flow that left the tournament on some other level (or errored out before
# resetting it back) means the very next cold start can legitimately land on
# "Level 12" instead — asserting on that used to fail this subflow itself.
# "Current Blinds" is always present regardless of which level it's on.
- extendedWaitUntil:
    visible: "Current Blinds"
    timeout: 10000

# See _dismiss-logbox.yaml: the emulator has no Play Billing, so RevenueCat
# logs a small batch of startup errors that RN's LogBox turns into a
# footer-covering toast. They don't always have fired yet this early, so a
# flow that reaches a footer tap should call _dismiss-logbox.yaml again
# right before it — this first pass only catches the (common) case where
# they beat this point.
- runFlow: _dismiss-logbox.yaml
