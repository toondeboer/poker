appId: com.toondeboer.pokerkit
---
# §5 keyboard: the generator sheet's fields stay usable with the keyboard up
# — focusing a field and typing into it should both work and leave the
# sheet's own footer buttons reachable, not just silently swallowed input.
#
# Real bug, now fixed: Sheet.tsx's KeyboardAvoidingView was a no-op for
# Android in this Modal context — confirmed via a temporary on-screen
# listener that keyboardDidShow/keyboardDidHide fire correctly (so the event
# itself wasn't the problem), while `behavior="height"` still produced a
# pixel-identical screenshot to `behavior={undefined}`. Same root cause
# useKeyboardNudge.ts documents for Presets: measuring against
# `Dimensions.get('window').height` doesn't account for this rendering
# inside a Modal's own separate Android window. Fixed by tracking the
# keyboard height directly via Keyboard.addListener and applying it as
# `marginBottom` on the sheet itself, bypassing KeyboardAvoidingView's
# broken internal measurement for Android entirely.
#
# Also: a bare "Generate" selector matches two elements (this list button
# and blinds.tsx's header-right sparkles icon, "Generate a blind
# structure") and — on both platforms — opens Expo's dev menu instead of
# tapping either one. Point-based tap sidesteps it, same fix as
# generator-chip25-casino-sheet.yaml's iOS version.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn:
    text: ".*Reset to default.*"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"
- tapOn:
    point: "26%,19%"
- assertVisible: "Generate structure"

- tapOn:
    text: "^5$"
- longPressOn:
    text: "^5$"
- eraseText: 3
- inputText: "40"
- assertVisible:
    text: "^40$"
# The footer's primary action is genuinely reachable while the keyboard is
# up now — not just present somewhere off-screen.
- assertVisible: "Replace structure"

- tapOn: "Cancel"
