appId: com.toondeboer.pokerkit
---
# §2 editor: delete down to the 2-level floor disables the trash buttons, and
# Discard restores the active values. Also covers the "end of list"
# Insert-below case (see editor-insert-duplicate.yaml for why that's here
# instead of against the full 30-row list) on the short list this leaves us
# with partway through.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn: "Reset to default"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

# Delete from the top repeatedly down to 3 levels — always tapping "Delete
# level 1", since removing the top row shifts everything else up by one.
- repeat:
    times: 27
    commands:
      - tapOn:
          text: "Delete level 1"
- assertVisible:
    text: "^3 levels$"

# End of (now short) list: Insert below on Level 3, the last row.
- tapOn:
    text: "Add a level around level 3"
- assertVisible: "Insert below"
- tapOn: "Insert below"
- assertVisible:
    text: "^4 levels$"

# Keep deleting from the top down to the 2-level floor.
- repeat:
    times: 2
    commands:
      - tapOn:
          text: "Delete level 1"
- assertVisible:
    text: "^2 levels$"

# Trash buttons disable at the floor.
- assertVisible:
    text: "Delete level 1"
    enabled: false
- assertVisible:
    text: "Delete level 2"
    enabled: false

# Discard restores the untouched active schedule (still the default 30).
# See _dismiss-logbox.yaml — a RevenueCat dev-error toast tends to appear
# right around here (its timing isn't fully predictable — the app is
# provably silent for 20+ idle seconds elsewhere, so this is very likely
# something about the preceding burst of 29 rapid taps rather than a plain
# timer), so retry the tap a couple of times if it gets swallowed by LogBox
# instead of reaching the button.
- runFlow: _dismiss-logbox.yaml
- tapOn: "Discard"
- runFlow: _dismiss-logbox.yaml
- runFlow:
    when:
      notVisible:
        text: "^30 levels$"
    commands:
      - tapOn: "Discard"
      - runFlow: _dismiss-logbox.yaml
- runFlow:
    when:
      notVisible:
        text: "^30 levels$"
    commands:
      - tapOn: "Discard"
      - runFlow: _dismiss-logbox.yaml
- assertVisible:
    text: "^30 levels$"
