appId: com.toondeboer.pokerkit
---
# iOS version of round-duration.yaml. Field positions measured the same way
# (via `maestro hierarchy` bounds), but note the labels/values expose their
# text via `accessibilityText`, not `text`, on iOS - same underlying reason
# as other iOS quirks in this suite (RN's Text-as-accessibility-value
# behavior differs slightly by platform). Minutes field center ~(29%,63%),
# Seconds ~(71%,63%) on this iPhone 17 (402x874pt logical size).
- runFlow: _cold-start-ios.yaml
- openLink: "pokerkit://settings"
- assertVisible: "Round duration"
- assertNotVisible: "Save Timer Settings"

- tapOn:
    point: "29%,63%"
- longPressOn:
    point: "29%,63%"
- tapOn: "Select All"
- eraseText: 5
- inputText: "12"
- tapOn:
    point: "71%,63%"
- longPressOn:
    point: "71%,63%"
- tapOn: "Select All"
- eraseText: 5
- inputText: "30"
- tapOn: "Round duration"
- assertVisible: "Each blind level lasts 12:30."

- tapOn:
    point: "71%,63%"
- longPressOn:
    point: "71%,63%"
- tapOn: "Select All"
- eraseText: 5
- inputText: "99"
- tapOn: "Round duration"
- assertVisible: "Each blind level lasts 12:59."
- assertNotVisible:
    text: "^99$"
