appId: com.toondeboer.pokerkit
---
# §6 notifications: round expiry fires the in-app "Time's Up!" alert (with its
# vibration pattern) while the app is genuinely foregrounded — CLAUDE.md notes
# this could previously silently fail to show in that case, auto-advancing
# the blind level with no alert at all.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://settings"
- assertVisible: "Round duration"
- tapOn:
    point: "29%,59%"
- longPressOn:
    point: "29%,59%"
- eraseText: 5
- inputText: "0"
# 10s, not 3s: MIN_ROUND_DURATION_SECONDS in @poker/core floors anything
# shorter, which is correct clamping — not a bug — but means this flow needs
# to target the real floor rather than an arbitrarily small number.
- tapOn:
    point: "71%,59%"
- longPressOn:
    point: "71%,59%"
- eraseText: 5
- inputText: "10"
- tapOn: "Round duration"
- assertVisible: "Each blind level lasts 00:10."

- openLink: "pokerkit://"
- assertVisible:
    text: "^00:10$"
- tapOn: "Start"

# Give it a little more than the 10s round to actually expire.
- extendedWaitUntil:
    visible: "Time's Up!"
    timeout: 15000
- assertVisible: "Level 1 Complete"
- tapOn: "Next Blinds"
