appId: com.toondeboer.pokerkit
---
# §4 round duration: mm:ss commits live (no Save button — DurationField.tsx's
# own comment says it commits on every edit specifically so a running round's
# remaining time is never disturbed), and the seconds field clamps to 59.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://settings"
- assertVisible: "Round duration"
- assertNotVisible: "Save Timer Settings"

# Select fields by fixed screen position rather than by current value text
# (unpredictable — whatever a previous run left it at) or by "below"/"leftOf"
# relative selectors (tried first: Maestro didn't intersect those the way
# expected, and every query resolved to the Minutes field regardless of which
# label was given). Percentages measured from `maestro hierarchy` bounds on
# this Pixel_10 emulator (1080x2424): Minutes field center ~(29%,59%),
# Seconds field center ~(71%,59%) — both directly below their label, Round
# duration being the first card so no scroll is needed to reach them.
#
# Blurring by tapping the "Round duration" label rather than `hideKeyboard`:
# hideKeyboard only dismisses the IME on Android, it doesn't move focus off
# the EditText, so it never fires React Native's onBlur at all — confirmed
# by comparing against a real focus-losing tap, which does. Everything here
# needs a genuine blur, not just the keyboard going away.
- tapOn:
    point: "29%,59%"
- longPressOn:
    point: "29%,59%"
- eraseText: 5
- inputText: "12"
- tapOn:
    point: "71%,59%"
- longPressOn:
    point: "71%,59%"
- eraseText: 5
- inputText: "30"
- tapOn: "Round duration"
# No separate save step — the helper line (and, per DurationField.tsx, the
# actual timerDuration value) already reflects 12:30.
- assertVisible: "Each blind level lasts 12:30."

# Seconds field clamps to 59 even though 99 is briefly what's typed.
# NumberField.tsx's onBlur used to recompute its own clamp from `raw` using
# only its local `min` (default 0), ignoring any secondary clamp a parent
# already applied via onChangeValue — so blurring after typing 99 could
# leave the *display* stuck on "99" even though DurationField's own
# `Math.min(59, value)` had already made the real duration 12:59. Fixed by
# having onBlur just trust the latest `value` prop (which already reflects
# any such parent clamp) instead of recomputing its own. Verified against
# the pre-fix code with a real blur (not hideKeyboard) that this genuinely
# reproduced "99" stuck on screen.
- tapOn:
    point: "71%,59%"
- longPressOn:
    point: "71%,59%"
- eraseText: 5
- inputText: "99"
- tapOn: "Round duration"
- assertVisible: "Each blind level lasts 12:59."
- assertNotVisible:
    text: "^99$"
