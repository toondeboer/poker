appId: com.toondeboer.pokerkit
---
# iOS version of generator-replace-draft-only.yaml.
#
# NavRow.tsx's TouchableOpacity sets an explicit accessibilityLabel
# ("<title>. <summary>"), which on iOS collapses its whole subtree -
# including the "Unapplied changes" Badge child - into just that one opaque
# accessibility string, so the badge used to be genuinely absent from the
# accessibility tree. Fixed by threading a `badgeLabel` prop through NavRow
# that gets folded into the same accessibilityLabel
# ("<title>. <summary>. <badgeLabel>") — verified below via a real
# assertion now, not just a screenshot.
- runFlow: _cold-start-ios.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn:
    text: ".*Reset to default.*"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

# NavRow merges its title + summary into one accessibility string on iOS
# ("Blind structure. 30 levels · 5/10 → 800/1600") rather than exposing them
# as separate text nodes like Android — an anchored "^30 levels..." selector
# never matches, needs a substring wrap.
- openLink: "pokerkit://settings"
- assertVisible:
    text: ".*30 levels · 5/10 → .*"
- takeScreenshot: replace-draft-only-ios-before

- openLink: "pokerkit://blinds"
# Point-based tap on the list "Generate" button — see
# generator-chip25-casino-sheet-ios.yaml for why a text selector is
# ambiguous here (also matches blinds.tsx's header-right sparkles icon).
- tapOn:
    point: "26%,21%"
- assertVisible: "Generate structure"
- tapOn:
    text: "^30$"
- longPressOn:
    text: "^30$"
- tapOn: "Select All"
- eraseText: 2
- inputText: "10"
- tapOn:
    text: ".*Replace structure.*"
- assertVisible: "Replace"
- tapOn:
    text: "^Replace$"
- runFlow: _dismiss-logbox-ios.yaml
- assertVisible:
    text: "^10 levels$"

# Active schedule (30 levels) must be unchanged, and the "Unapplied
# changes" badge now folds into the same accessibilityLabel.
- openLink: "pokerkit://settings"
- assertVisible:
    text: ".*30 levels · 5/10 → .*Unapplied changes.*"
- takeScreenshot: replace-draft-only-ios-after
