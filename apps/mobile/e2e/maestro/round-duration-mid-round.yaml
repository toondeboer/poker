appId: com.toondeboer.pokerkit
---
# §4 round duration: changing the setting while a round is actually running
# must leave that round's remaining time alone — DurationField.tsx's own
# comment says core's `withDuration` only re-syncs `timeLeft` on a genuinely
# reset timer. Uses explicit 5:00 -> 8:00 rather than relying on whatever a
# previous flow left the duration at.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://settings"
- assertVisible: "Round duration"

# Same field positions/blur technique as round-duration.yaml.
- tapOn:
    point: "29%,59%"
- longPressOn:
    point: "29%,59%"
- eraseText: 5
- inputText: "5"
- tapOn:
    point: "71%,59%"
- longPressOn:
    point: "71%,59%"
- eraseText: 5
- inputText: "0"
- tapOn: "Round duration"
- assertVisible: "Each blind level lasts 05:00."

# Back to the timer, freshly at 05:00 and not yet started.
- openLink: "pokerkit://"
- assertVisible:
    text: "^05:00$"
- assertVisible: "Start"
- tapOn: "Start"
- assertVisible: "Pause"

# Change the duration to something clearly different while that round is
# still running, without ever pausing/resetting it.
- openLink: "pokerkit://settings"
- tapOn:
    point: "29%,59%"
- longPressOn:
    point: "29%,59%"
- eraseText: 5
- inputText: "8"
- tapOn: "Round duration"
- assertVisible: "Each blind level lasts 08:00."

# The running round must still be running, and its remaining time must not
# have snapped to the new 08:00 duration.
- openLink: "pokerkit://"
- assertVisible: "Pause"
- assertNotVisible:
    text: "^08:00$"
