appId: com.toondeboer.pokerkit
---
# iOS version of editor-insert-duplicate.yaml. IconButton.tsx sets its own
# accessibilityLabel directly (no separate icon+text merge like Button.tsx),
# so "Add a level around level N" matches literally on both platforms - only
# Button.tsx-based buttons (Reset to default, Generate, etc.) need the
# .*label.* substring wrap.
- runFlow: _cold-start-ios.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn:
    text: ".*Reset to default.*"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

- tapOn:
    text: "Add a level around level 1"
- assertVisible: "Insert below"
- tapOn: "Insert below"
- assertVisible:
    text: "^31 levels$"

- scrollUntilVisible:
    element:
      text: "Add a level around level 15"
    direction: DOWN
- tapOn:
    text: "Add a level around level 15"
- assertVisible: "Duplicate this level"
- tapOn: "Duplicate this level"
- scrollUntilVisible:
    element:
      text: "^[0-9]+ levels$"
    direction: UP
- assertVisible:
    text: "^32 levels$"
