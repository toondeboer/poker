appId: com.toondeboer.pokerkit
---
# iOS version of editor-clear-blur.yaml — §2: clearing a blind field shows
# empty (not 0), and blur restores the old value.
#
# Three iOS-specific quirks vs. the Android version of this flow:
# - Any Button with both an `icon` and a text label (Button.tsx) merges them
#   into one accessibility string like ", Reset to default" (icon glyph +
#   comma + label) - Android exposes icon and text as separate nodes, so the
#   bare label matched there, but on iOS a literal "Reset to default"
#   selector never full-matches and silently reports "not found". Every
#   icon+label button needs a `.*label.*` substring wrap here; plain
#   text-only elements (values, alert buttons, headers) don't.
# - `longPressOn` a text field opens iOS's native "Select | Select All |
#   AutoFill" callout rather than directly selecting like Android does - a
#   follow-up tap on "Select All" is required before eraseText does
#   anything (confirmed: without it, eraseText is a silent no-op here).
# - After erasing, the field's real `text`/`value` attributes go empty
#   immediately (confirmed via `maestro hierarchy` and a screenshot), but its
#   synthesized `accessibilityText` can keep reporting the old "5" for a
#   while - Maestro's text selectors match either attribute, so
#   assertNotVisible on the old value flakes here even though the field is
#   genuinely empty. Verified manually via screenshot instead of asserting
#   it in this repeatable flow; not worth chasing further; VoiceOver-only,
#   not a real behavior bug (the actual `value` is correct immediately).
- runFlow: _cold-start-ios.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn:
    text: ".*Reset to default.*"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

- tapOn:
    text: "^5$"
- longPressOn:
    text: "^5$"
- tapOn: "Select All"
- eraseText: 3
- takeScreenshot: clear-blur-ios-cleared

# Blur by focusing Level 1's big blind field instead.
- tapOn:
    text: "^10$"
    index: 0
- assertVisible:
    text: "^5$"
