appId: com.toondeboer.pokerkit
---
# iOS version of editor-apply-shorter-schedule.yaml.
- runFlow: _cold-start-ios.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn:
    text: ".*Reset to default.*"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

- scrollUntilVisible:
    element:
      text: "Jump the tournament to level 12"
    direction: DOWN
- tapOn:
    text: "Jump the tournament to level 12"
- assertVisible: "Jump to Level 12?"
- tapOn: "Jump"
- assertVisible: "LIVE"

- scrollUntilVisible:
    element:
      text: "Delete level 1"
    direction: UP
- repeat:
    times: 26
    commands:
      - tapOn:
          text: "Delete level 1"
- scrollUntilVisible:
    element:
      text: "^[0-9]+ levels$"
    direction: UP
- assertVisible:
    text: "^4 levels$"

- runFlow: _dismiss-logbox-ios.yaml
- assertVisible: ".*no longer exists.*"
- assertVisible: "Level 4"

# "Apply changes" has icon="checkmark" (ApplyFooter.tsx), so it needs the
# .*label.* substring wrap unlike "Discard" (no icon).
#
# The retry guard here checks for the warning disappearing, not "^4 levels$"
# — the level count is already 4 *before* Apply (that's the draft, unaffected
# by Apply/Discard either way), so it can never detect a failed Apply.
# Confirmed the hard way: a LogBox interruption swallowed the first Apply tap
# here exactly like it did Discard in editor-delete-discard-ios.yaml, and the
# level-count-based guard didn't retry because the count looked "fine" the
# whole time — the screen was still visibly on the pre-apply dirty draft
# (still "Unapplied changes", no LIVE tag, warning still showing).
- runFlow: _dismiss-logbox-ios.yaml
- tapOn:
    text: ".*Apply changes.*"
- runFlow: _dismiss-logbox-ios.yaml
- runFlow:
    when:
      visible: ".*no longer exists.*"
    commands:
      - tapOn:
          text: ".*Apply changes.*"
      - runFlow: _dismiss-logbox-ios.yaml
- runFlow:
    when:
      visible: ".*no longer exists.*"
    commands:
      - tapOn:
          text: ".*Apply changes.*"
      - runFlow: _dismiss-logbox-ios.yaml
- assertVisible:
    text: "^4 levels$"
- assertNotVisible: ".*no longer exists.*"
- assertVisible: "LIVE"

# Maestro's `back` command is Android-only (hardware back); iOS navigates
# via the header's own back button instead, which merges its chevron glyph
# with "Settings" into one accessibility string, same as icon+label buttons.
- tapOn:
    text: ".*Settings.*"
- assertVisible: "Level 4"
