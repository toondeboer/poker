appId: com.toondeboer.pokerkit
---
# §2 editor: "+" -> Insert below / Duplicate this level, exercised at the top,
# middle and end of the list.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn: "Reset to default"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

# Top: Insert below on Level 1.
- tapOn:
    text: "Add a level around level 1"
- assertVisible: "Insert below"
- tapOn: "Insert below"
- assertVisible:
    text: "^31 levels$"

# Middle: Duplicate on (what is now) Level 15 — scroll it into view first.
- scrollUntilVisible:
    element:
      text: "Add a level around level 15"
    direction: DOWN
- tapOn:
    text: "Add a level around level 15"
- assertVisible: "Duplicate this level"
- tapOn: "Duplicate this level"
- assertVisible:
    text: "^32 levels$"

# End: Insert below on the last level (32nd) — scroll to the footer's "Add
# level" button, which only ever sits below the very last row.
- scrollUntilVisible:
    element:
      text: "Add level"
    direction: DOWN
- tapOn:
    text: "Add a level around level 32"
- assertVisible: "Insert below"
- tapOn: "Insert below"
- assertVisible:
    text: "^33 levels$"
