appId: com.toondeboer.pokerkit
---
# iOS version of editor-kill-dirty-draft.yaml. Simpler than Android here:
# a plain stopApp+launchApp lands straight back in the app (see
# _cold-start-ios.yaml), no dev-launcher deep-link workaround needed, so
# there's no need to do the kill+relaunch "by hand" the way the Android
# version does to land back on a specific screen.
- runFlow: _cold-start-ios.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn:
    text: ".*Reset to default.*"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

- scrollUntilVisible:
    element:
      text: "Delete level 1"
    direction: DOWN
- tapOn:
    text: "Delete level 1"
- assertVisible:
    text: "^29 levels$"
- runFlow: _dismiss-logbox-ios.yaml
- assertVisible:
    text: ".*Apply changes.*"

- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Current Blinds"
    timeout: 10000
- runFlow: _dismiss-logbox-ios.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"

- runFlow: _dismiss-logbox-ios.yaml
- assertVisible:
    text: "^29 levels$"
- assertVisible:
    text: ".*Apply changes.*"
