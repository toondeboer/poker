appId: com.toondeboer.pokerkit
---
# §3 generator: "Replace structure" only writes the draft. The active
# schedule (what Settings' Tournament card and the timer actually play)
# must stay untouched until Apply — TournamentCard.tsx pulls its summary
# from the *active* levels deliberately, so this is what should still read
# the pre-replace values.
- runFlow: _cold-start.yaml
- openLink: "pokerkit://blinds"
- assertVisible: "Blind structure"
- tapOn: "Reset to default"
- tapOn:
    text: "^Reset$"
- assertVisible:
    text: "^30 levels$"

# Confirm the active baseline on Settings before touching anything: 30
# levels, no "Unapplied changes" badge.
- openLink: "pokerkit://settings"
- assertVisible:
    text: "^30 levels · 5/10 → .*$"
- assertNotVisible: "Unapplied changes"

# Replace the draft with a shorter, 10-level structure.
- openLink: "pokerkit://blinds"
- tapOn: "Generate"
- assertVisible: "Generate structure"
- tapOn:
    text: "^30$"
- longPressOn:
    text: "^30$"
- eraseText: 2
- inputText: "10"
- hideKeyboard
- tapOn: "Replace structure"
- assertVisible: "Replace"
- tapOn:
    text: "^Replace$"
- runFlow: _dismiss-logbox.yaml
- assertVisible:
    text: "^10 levels$"

# Back on Settings, without ever tapping Apply: the active schedule must
# still say 30, and the dirty draft should now surface as "Unapplied
# changes" rather than changing the summary itself.
- openLink: "pokerkit://settings"
- assertVisible:
    text: "^30 levels · 5/10 → .*$"
- assertVisible: "Unapplied changes"
