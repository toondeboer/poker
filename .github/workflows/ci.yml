name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs before the tests because a formatting failure is instant and its
      # fix is `npm run format`, where a test failure wants reading.
      - name: Format
        run: npm run format:check

      # Cheap, and it guards the file whose entire value is that its numbers
      # are right — two of them were wrong before anything checked.
      - name: Store listing
        run: npm run check:listing

      - name: Test
        run: npm run test
